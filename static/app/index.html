<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fiş Çek — Fiş OCR</title>
  <meta name="description" content="Market fişlerini telefonla çek; ürünler, toplamlar ve KDV saniyeler içinde yapılandırılmış veriye dönüşsün.">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1115; color: #e8e6e1;
    }
    .bar {
      display: flex; align-items: center; gap: .65rem;
      padding: calc(.8rem + env(safe-area-inset-top)) 1.1rem .8rem;
      background: #14171d; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .bar svg { display: block; }
    h1 { font-size: 1.15rem; margin: 0; letter-spacing: .01em; flex: 1; }
    .chip {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .78rem; font-weight: 600; padding: .3rem .65rem;
      border-radius: 999px; border: 1px solid transparent;
      transition: background-color .25s, color .25s, border-color .25s;
    }
    .chip::before {
      content: ""; width: .5rem; height: .5rem; border-radius: 50%;
      background: currentColor;
    }
    .chip-on  { color: #4ade80; background: rgba(74,222,128,.1);  border-color: rgba(74,222,128,.25); }
    .chip-off { color: #fbbf24; background: rgba(251,191,36,.1);  border-color: rgba(251,191,36,.3); }
    main { flex: 1; width: 100%; max-width: 34rem; margin: 0 auto; padding: 1.4rem 1.1rem 2rem; }
    .card {
      background: #171a21; border: 1px solid rgba(255,255,255,.07);
      border-radius: 1rem; padding: 1.3rem 1.2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .card h2 { margin: 0 0 .5rem; font-size: 1.02rem; }
    .card p { margin: 0 0 .8rem; line-height: 1.55; color: #b9bcc4; font-size: .93rem; }
    .card p:last-child { margin-bottom: 0; }
    .hint { font-size: .82rem; color: #8b8f99; }
    footer {
      text-align: center; font-size: .75rem; color: #6b6f78;
      padding: 0 1rem calc(1rem + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <header class="bar">
    <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
      <path d="M12 6h24v36l-6-3-6 3-6-3-6 3Z" fill="none" stroke="#4ade80" stroke-width="3" stroke-linejoin="round"/>
      <path d="M18 16h12M18 23h12M18 30h7" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>Fiş Çek</h1>
    <span id="net-durumu" class="chip chip-on" role="status">Çevrimiçi</span>
  </header>
  <main>
    <section class="card">
      <h2>Hoş geldin</h2>
      <p>Market fişlerini telefonla çek; ürünler, toplamlar ve KDV saniyeler içinde yapılandırılmış veriye dönüşsün.</p>
      <p class="hint">Telefonuna kurmak için tarayıcının menüsünden <strong>Ana Ekrana Ekle</strong>&rsquo;yi seç. Kurduktan sonra uygulama çevrimdışıyken de açılır.</p>
    </section>
  </main>
  <footer>OCR API &middot; sözleşme v1</footer>
  <script>
    const durum = document.getElementById("net-durumu");
    function ciz() {
      const cevrimici = navigator.onLine;
      durum.textContent = cevrimici ? "Çevrimiçi" : "Çevrimdışı";
      durum.classList.toggle("chip-on", cevrimici);
      durum.classList.toggle("chip-off", !cevrimici);
    }
    addEventListener("online", ciz);
    addEventListener("offline", ciz);
    ciz();
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
